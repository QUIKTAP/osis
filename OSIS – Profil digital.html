<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSIS – Profil digital</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1F5CA8;--blue-deep:#123F78;--orange:#F28A1B;--yellow:#FFC31F;--bg:#EEF3FA;--surface:#fff;--text:#14253D;--muted:#5A6B82;--line:#D8E2F0;--on-orange:#10305E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A2E;--surface:#13263F;--text:#EAF1FB;--muted:#9FB2CC;--line:#243B5A;--blue:#4A8BE0}}
:root[data-theme="dark"]{--bg:#0C1A2E;--surface:#13263F;--text:#EAF1FB;--muted:#9FB2CC;--line:#243B5A;--blue:#4A8BE0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding-bottom:32px}
.hero{position:relative;height:170px;background:var(--blue-deep);overflow:hidden;border-radius:0 0 36px 36px}
.hero::before{content:"";position:absolute;right:-50px;top:-70px;width:260px;height:260px;border-radius:50%;background:linear-gradient(200deg,var(--yellow),var(--orange))}
.hero::after{content:"";position:absolute;right:-20px;top:-40px;width:250px;height:250px;border-radius:50%;background:var(--blue-deep)}
.hero i{position:absolute;left:-40px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:var(--blue);opacity:.55}
.back{position:absolute;z-index:2;left:14px;top:14px;display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.14)}
.card{position:relative;margin:-70px 18px 0;background:var(--surface);border-radius:24px;padding:22px 20px 24px;box-shadow:0 10px 30px rgba(18,63,120,.14);text-align:center}
.logo{display:block;margin:0 auto 14px;width:170px;max-width:60%;height:auto;background:#fff;border-radius:12px;padding:6px 10px}
.avatar{width:92px;height:92px;margin:-68px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;font-weight:700;color:var(--on-orange);background:linear-gradient(200deg,var(--yellow),var(--orange));border:5px solid var(--surface)}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.role{margin:2px 0 0;color:var(--muted);font-weight:500}
.tag{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;background:rgba(242,138,27,.16);font-size:.85rem;font-weight:600;border:1px solid var(--orange);color:var(--text);text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;text-decoration:none;color:var(--text)}
.chip img{height:26px;background:#fff;border-radius:8px;padding:3px 6px}
.chip span{font-size:.85rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 18px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font:600 .95rem 'Figtree',system-ui,sans-serif;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn svg,.ic svg{width:18px;height:18px;flex:none}
.main{background:var(--orange);color:var(--on-orange)}
.alt{background:var(--blue);color:#fff}
.line{background:transparent;color:var(--text);border-color:var(--line)}
.btn:focus-visible,.row:focus-visible,.back:focus-visible,.tag:focus-visible,.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wide{grid-column:1/-1}
.list{margin:20px 18px 0;background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;padding:14px 16px;color:var(--text);text-decoration:none}
.row+.row{border-top:1px solid var(--line)}
.ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(200deg,var(--yellow),var(--orange));color:var(--on-orange)}
.row small{display:block;color:var(--muted);font-size:.8rem}
.row b{font-weight:600;word-break:break-word}
.row .grow{flex:1;min-width:0}
.row .chev{color:var(--muted);width:18px;height:18px}
.sec{margin:24px 18px 0}
.sec h2{margin:0 0 10px;font-size:1.1rem}
.about{padding:18px;border-radius:20px;border:1px solid var(--line);border-left:5px solid var(--orange);background:var(--surface)}
.about p{margin:0;color:var(--muted);max-width:60ch}
.svc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.svc span{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;font-weight:500}
.mini{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:var(--on-orange);background:linear-gradient(200deg,var(--yellow),var(--orange))}
.foot{margin:22px 18px 0;text-align:center;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){.card{animation:up .5s ease both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
</style>
</head>

const CO={name:"OSIS",slogan:"[Slogan de la société]",phone:"+216 XX XXX XXX",wa:"216XXXXXXXX",email:"contact@osis.tn",site:"www.osis.tn",address:"[Adresse de la société, Ville, Tunisie]",
about:"[Présentation courte de la société : activité, expérience, clients. Deux ou trois phrases.]",
services:["[Service 1]","[Service 2]","[Service 3]","[Service 4]"]};
const TEAM=[
{id:"membre-1",name:"[Prénom Nom]",ini:"PN",role:"[Fonction]",phone:"+216 XX XXX XXX",wa:"216XXXXXXXX",email:"prenom@osis.tn"},
{id:"membre-2",name:"[Prénom Nom]",ini:"PN",role:"[Fonction]",phone:"+216 XX XXX XXX",wa:"216XXXXXXXX",email:"prenom@osis.tn"},
{id:"membre-3",name:"[Prénom Nom]",ini:"PN",role:"[Fonction]",phone:"+216 XX XXX XXX",wa:"216XXXXXXXX",email:"prenom@osis.tn"}
];
const P={
phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
back:'<path d="m15 18-6-6 6-6"/>',
next:'<path d="m9 18 6-6-6-6"/>',
save:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>'};
const ic=(n,c)=>`<svg ${c?`class="${c}" `:''}viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const tel=s=>s.replace(/[^\d+]/g,"");
const row=(i,l,v,h)=>`<a class="row" href="${h}"><span class="ic">${ic(i)}</span><span class="grow"><small>${l}</small><b>${v}</b></span></a>`;

function home(){
  const team=TEAM.map(m=>`<a class="row" href="#${m.id}"><span class="mini">${m.ini}</span><span class="grow"><b>${m.name}</b><small>${m.role}</small></span>${ic('next','chev')}</a>`).join("");
  return `<div class="hero" aria-hidden="true"><i></i></div>
  <section class="card"><img class="logo" alt="Logo OSIS" src="${LOGO}"><h1>${CO.name}</h1><p class="role">${CO.slogan}</p></section>
  <div class="actions">
    <a class="btn main" href="tel:${tel(CO.phone)}">${ic('phone')}Appeler</a>
    <a class="btn alt" href="https://wa.me/${CO.wa}">${ic('wa')}WhatsApp</a>
    <a class="btn line" href="mailto:${CO.email}">${ic('mail')}E-mail</a>
    <a class="btn line" href="https://${CO.site}">${ic('globe')}Site web</a>
    <a class="btn line wide" href="https://maps.google.com/?q=${encodeURIComponent(CO.address)}">${ic('pin')}Adresse de la société</a>
    <button class="btn alt wide" type="button" data-vcf="co">${ic('save')}Enregistrer le contact</button>
  </div>
  <section class="sec"><h2>À propos</h2><div class="about"><p>${CO.about}</p><div class="svc">${CO.services.map(s=>`<span>${s}</span>`).join("")}</div></div></section>
  <section class="sec"><h2>Notre équipe</h2><div class="list" style="margin:0">${team}</div></section>
  <section class="sec"><h2>Nous contacter</h2><div class="list" style="margin:0">${row('phone','Téléphone',CO.phone,'tel:'+tel(CO.phone))}${row('mail','E-mail',CO.email,'mailto:'+CO.email)}${row('pin','Adresse',CO.address,'https://maps.google.com/?q='+encodeURIComponent(CO.address))}</div></section>
  <p class="foot">Profil numérique OSIS</p>`;
}
function profile(m){
  return `<div class="hero" aria-hidden="true"><i></i></div>
  <a class="back" href="#societe" style="top:calc(14px + 0px)">${ic('back')}${CO.name}</a>
  <section class="card" style="margin-top:-60px;padding-top:0"><div class="avatar" style="margin-top:-46px">${m.ini}</div><h1>${m.name}</h1><p class="role">${m.role}</p>
  <a class="chip" href="#societe"><img alt="" src="${LOGO}"><span>Voir la société</span></a></section>
  <div class="actions">
    <a class="btn main" href="tel:${tel(m.phone)}">${ic('phone')}Appeler</a>
    <a class="btn alt" href="https://wa.me/${m.wa}">${ic('wa')}WhatsApp</a>
    <a class="btn line" href="mailto:${m.email}">${ic('mail')}E-mail</a>
    <button class="btn line" id="share" type="button">${ic('share')}Partager</button>
    <button class="btn alt wide" type="button" data-vcf="${m.id}">${ic('save')}Enregistrer le contact</button>
    <a class="btn line wide" href="https://maps.google.com/?q=${encodeURIComponent(CO.address)}">${ic('pin')}Adresse de la société</a>
  </div>
  <section class="list">${row('phone','Téléphone',m.phone,'tel:'+tel(m.phone))}${row('mail','E-mail',m.email,'mailto:'+m.email)}${row('globe','Site web',CO.site,'https://'+CO.site)}</section>
  <p class="foot">${CO.name} · Profil numérique</p>`;
}
const v=s=>s.replace(/[,;]/g,"\\$&");
function card(m){const x=m||{name:CO.name,role:"",phone:CO.phone,email:CO.email};return ["BEGIN:VCARD","VERSION:3.0","FN:"+v(x.name),"ORG:"+v(CO.name),x.role?"TITLE:"+v(x.role):"","TEL;TYPE=CELL:"+tel(x.phone),"EMAIL:"+x.email,"URL:https://"+CO.site,"ADR;TYPE=WORK:;;"+v(CO.address)+";;;;","END:VCARD"].filter(Boolean).join("\r\n")}
function saveCard(id){const m=TEAM.find(x=>x.id===id);const b=new Blob([card(m)],{type:"text/vcard;charset=utf-8"});const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=(m?m.id:"osis")+".vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function route(){
  const h=location.hash.slice(1),m=TEAM.find(x=>x.id===h);
  document.getElementById("app").innerHTML=m?profile(m):home();
  document.title=m?`${m.name} – ${CO.name}`:`${CO.name} – Profil digital`;
  const s=document.getElementById("share");
  if(s)s.onclick=async()=>{try{if(navigator.share){await navigator.share({title:document.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);s.lastChild.textContent="Lien copié"}}catch(e){}};
  document.querySelectorAll("[data-vcf]").forEach(b=>b.onclick=()=>saveCard(b.dataset.vcf));
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script>
